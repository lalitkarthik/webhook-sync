[project]
name = "webhook-sync"
version = "0.1.0"
description = "Receives Razorpay payment events, keeps one ledger row per payment, and mirrors it to a Google Sheet."
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21",
    "fastapi>=0.118",
    "filelock>=3.19",
    "google-auth>=2.40",
    "gspread>=6.2",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "razorpay>=1.4",
    "sqlalchemy[asyncio]>=2.0.43",
    "tzdata>=2025.2",
    "uvicorn>=0.37",
]

[project.scripts]
wsync = "webhook_sync.cli.main:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.405",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.13",
    "time-machine>=2.19",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
# Agent tooling and one-off helper scripts are not part of the service.
extend-exclude = [".claude", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
extraPaths = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["tests"]
markers = [
    "unrecorded: uses Razorpay's documented samples, not recorded deliveries (Q113)",
    "posix: needs POSIX signals and a direct child process; skipped on Windows (deploys run Linux)",
    "smoke: drives the real wsync serve end to end (uv run pytest -m smoke)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "webhook_sync"

[[tool.importlinter.contracts]]
name = "Layers: entry points over workers over queue over storage over primitives"
type = "layers"
# Top to bottom. A layer may import any layer below it, never one above.
# `|` siblings may not import each other; `:` siblings may.
# receiver, ledger, sources and sweeper share a layer because sources.razorpay imports
# receiver.rate_cap while receiver imports ledger and sources (a cycle today), and the sweeper
# stores through receiver.store while the receiver's lifespan starts the sweeper (and verify).
layers = [
    "webhook_sync.cli",
    "webhook_sync.admin",
    "webhook_sync.receiver : webhook_sync.ledger : webhook_sync.sources : webhook_sync.sweeper : webhook_sync.verify",
    "webhook_sync.sinks",
    "webhook_sync.alerts",
    "webhook_sync.queue",
    "webhook_sync.db | webhook_sync.logs",
    "webhook_sync.config | webhook_sync.clock",
]
